[project]
name = "onboardflow-api"
version = "3.0.0.dev0"
description = "OnboardFlow v3 backend: repo ingestion, code-search agent, PR review, evals."
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "sqlalchemy[asyncio]>=2.1.9",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onboardflow"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W", "F",   # pycodestyle, pyflakes
  "I",             # isort
  "B",             # bugbear
  "UP",            # pyupgrade
  "ASYNC",         # blocking calls inside async code
  "S",             # bandit (security)
  "SIM", "RUF", "PT", "N", "C4", "RET", "TID",
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S106"]  # pytest asserts; fake credentials in fixtures

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*"]  # ships no type information
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers -m 'not integration and not network'"
filterwarnings = ["error"]
markers = [
  "integration: needs the docker compose services (run with `make test-integration`)",
  "network: needs internet access to GitHub (run with `make test-integration`)",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.6",
]
