[project]
name = "onboardflow-evals"
version = "3.0.0.dev0"
description = "OnboardFlow eval harness: datasets, systems under test, judge, metrics, reports."
requires-python = ">=3.13"
dependencies = [
    "anthropic>=2.14.0",
    "httpx>=0.28.1",
    "numpy>=2.5.5",
    "openai>=3.59.0",
    "pyarrow>=26.0.1",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "starlette>=1.10.0",
    "tree-sitter>=0.27.0",
    "tree-sitter-python>=0.25.0",
    "unidiff>=1.0.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
of-eval = "onboardflow_evals.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onboardflow_evals"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "ASYNC", "S", "SIM", "RUF", "PT", "N", "C4", "RET", "TID"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["pyarrow.*", "unidiff.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
filterwarnings = ["error"]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.6",
]
